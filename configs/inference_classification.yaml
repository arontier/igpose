# [must] Working folder, a temporary folder to generate graph file & embed file
working_path: /path/to/temp

# [must] Path to a directory of PDB files, we support both pdb and pdbqt
input_path: /path/to/pdbfilde/H1204TS014_1_D_H1204TS014_1_BECF_clean.nb-ag.pdbqt

# [must] Path to output CSV file
output_path: /output_path/test.csv

# [optional] cuda device, if you want to execute using cpu, let's set to -1
cuda: 0

# [optional] number of cpu workers to generate graphs, if it's just a file set to 1 else should be larger than 1
cpu_workers: 8

# [must]
repr_layer: 6

# [optional] batch size to generate embeddings
batch_size: 32

# classification or regression
mode: 'classification'

heavy_chain_id: 'A,B,C,D'

light_chain_id: ''

antigen_chain_id: 'E,F,G,H'

scheme: 'chothia'